<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="《体育教练研究手册》交互式视觉学习导航：从全书地图、研究主线到六章精读与两周行动计划。" />
  <meta name="theme-color" content="#f3f0e8" />
  <title>教练学精读导航 · Visual Study Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" />
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到学习内容</a>
  <div class="page-progress" aria-hidden="true"><span id="page-progress-bar"></span></div>

  <header class="site-header">
    <div class="masthead">
      <a class="brand" href="#overview" aria-label="返回全景页">
        <span class="brand-mark" aria-hidden="true">教</span>
        <span>
          <strong>教练学精读导航</strong>
          <small>COACHING STUDY FIELD GUIDE</small>
        </span>
      </a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换显示主题">
        <span class="theme-icon" aria-hidden="true">◐</span>
        <span class="theme-label">显示</span>
      </button>
    </div>

    <div class="hero">
      <div class="hero-copy">
        <p class="hero-kicker"><span></span> 从跨学科进入教练学</p>
        <h1>把一本手册，读成一张<br /><em>可以行走的研究地图</em></h1>
        <p class="hero-deck">不是逐页堆积笔记，而是沿着问题、证据与研究机会，建立属于自己的学科判断。</p>
      </div>
      <aside class="reading-status" aria-label="精读进度">
        <div class="status-topline">
          <span>六章精读进度</span>
          <strong id="progress-fraction">0 / 6</strong>
        </div>
        <div class="status-track" aria-hidden="true"><span id="chapter-progress-bar"></span></div>
        <p id="progress-message">从 Ch2 开始，先理解这门学科从哪里来。</p>
        <button class="status-action" type="button" data-jump-tab="chapters">继续精读 <span aria-hidden="true">→</span></button>
      </aside>
    </div>
  </header>

  <nav class="tab-bar" aria-label="学习旅程">
    <div class="tab-bar-inner" role="tablist" aria-orientation="horizontal">
      <button class="tab-btn active" id="tab-overview" role="tab" aria-selected="true" aria-controls="panel-overview" tabindex="0" data-tab="overview">
        <span class="tab-index">01</span><span><strong>建立全景</strong><small>先看全书</small></span>
      </button>
      <button class="tab-btn" id="tab-threads" role="tab" aria-selected="false" aria-controls="panel-threads" tabindex="-1" data-tab="threads">
        <span class="tab-index">02</span><span><strong>串起主线</strong><small>发现联系</small></span>
      </button>
      <button class="tab-btn" id="tab-chapters" role="tab" aria-selected="false" aria-controls="panel-chapters" tabindex="-1" data-tab="chapters">
        <span class="tab-index">03</span><span><strong>逐章精读</strong><small>理解证据</small></span>
      </button>
      <button class="tab-btn" id="tab-shocks" role="tab" aria-selected="false" aria-controls="panel-shocks" tabindex="-1" data-tab="shocks">
        <span class="tab-index">04</span><span><strong>校准认知</strong><small>改变视角</small></span>
      </button>
      <button class="tab-btn" id="tab-terms" role="tab" aria-selected="false" aria-controls="panel-terms" tabindex="-1" data-tab="terms">
        <span class="tab-index">05</span><span><strong>统一语言</strong><small>术语审计</small></span>
      </button>
      <button class="tab-btn" id="tab-plan" role="tab" aria-selected="false" aria-controls="panel-plan" tabindex="-1" data-tab="plan">
        <span class="tab-index">06</span><span><strong>形成行动</strong><small>计划备考</small></span>
      </button>
    </div>
  </nav>

  <main id="main-content">
    <section class="panel active" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview"></section>
    <section class="panel" id="panel-threads" role="tabpanel" aria-labelledby="tab-threads" hidden></section>
    <section class="panel" id="panel-chapters" role="tabpanel" aria-labelledby="tab-chapters" hidden></section>
    <section class="panel" id="panel-shocks" role="tabpanel" aria-labelledby="tab-shocks" hidden></section>
    <section class="panel" id="panel-terms" role="tabpanel" aria-labelledby="tab-terms" hidden></section>
    <section class="panel" id="panel-plan" role="tabpanel" aria-labelledby="tab-plan" hidden></section>
  </main>

  <footer class="site-footer">
    <span>Handbook of Sport Coaching Research · 2026</span>
    <span>所有内容均为释义与研究笔记，出处见各章标注。</span>
  </footer>
</body>
</html>
