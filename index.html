<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教练学精读导航</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,500;0,8..60,700;1,8..60,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" />
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <div class="header">
    <div class="header-eyebrow">精读导航 · Visual Study Guide</div>
    <h1>
      Handbook of Sport Coaching Research<br />
      <em>一位 CS 研究者的六章精读</em>
    </h1>
    <div class="header-meta">
      <span>Callary, Bloom, Rynne &amp; Gearity 主编 · 2026</span>
      <span>25 章 · 322 页 · Edward Elgar</span>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-bar-inner">
      <button class="tab-btn active" data-tab="overview">全景</button>
      <button class="tab-btn" data-tab="threads">三条线</button>
      <button class="tab-btn" data-tab="chapters">精读</button>
      <button class="tab-btn" data-tab="shocks">认知冲击</button>
      <button class="tab-btn" data-tab="terms">术语审计</button>
      <button class="tab-btn" data-tab="plan">计划 &amp; 备考</button>
    </div>
  </div>

  <div class="panel active" id="panel-overview"></div>
  <div class="panel" id="panel-threads"></div>
  <div class="panel" id="panel-chapters"></div>
  <div class="panel" id="panel-shocks"></div>
  <div class="panel" id="panel-terms"></div>
  <div class="panel" id="panel-plan"></div>
</body>
</html>
